# ==============================================================================
# PROJECT SENTINEL — RAILWAY CONFIGURATION
# Deploy unified single-container judge demo to Railway with persistent volume
# ==============================================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m backend.api.server"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

